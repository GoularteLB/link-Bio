<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#efe9e0" />
    <title>Lucas Goularte | FullStack Developer</title>
    <meta
      name="description"
      content="Portfolio de Lucas Goularte, desenvolvedor fullstack em Santa Catarina. Aplicacoes web, APIs e automacao de processos com Java, C#, Vue e Camunda."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Lucas Goularte | FullStack Developer" />
    <meta
      property="og:description"
      content="Aplicacoes web, APIs e automacao de processos de negocio."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@300;400;500&family=Caveat:wght@500;600&family=Mrs+Saint+Delafield&display=swap"
      rel="stylesheet"
    />

    <script>
      (function () {
        try {
          var root = document.documentElement
          var theme = localStorage.getItem('lg:theme')
          if (theme !== 'dark' && theme !== 'light') theme = 'light'
          root.dataset.theme = theme
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#14110e' : '#efe9e0')

          var locale = localStorage.getItem('lg:locale')
          if (locale !== 'pt' && locale !== 'en') {
            locale = (navigator.language || '').toLowerCase().indexOf('pt') === 0 ? 'pt' : 'en'
          }
          root.lang = locale === 'pt' ? 'pt-BR' : 'en'
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
